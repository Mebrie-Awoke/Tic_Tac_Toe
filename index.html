<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tic Tac Toe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card game-card shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <div>
          <h4 class="mb-0">Tic Tac Toe</h4>
          <small class="text-muted">Play locally or vs computer</small>
        </div>
        <div class="text-end">
          <div class="status" id="status">Player X's turn</div>

        </div>
      </div>

      <div class="my-3 d-flex justify-content-center">
        <div class="board" id="board" role="grid" aria-label="Tic tac toe board"></div>
      </div>

      <div class="row g-2 align-items-center mb-3 controls">
        <div class="col-sm">
          <div class="d-flex gap-2 flex-wrap">
            <button id="newRound" class="btn btn-outline-primary btn-sm">Restart</button>
            <button id="resetAll" class="btn btn-outline-danger btn-sm">Reset Scores</button>
          </div>
        </div>

        <div class="col-sm-auto">
          <select id="mode" class="form-select form-select-sm">
            <option value="2p">2 Players</option>
            <option value="ai-easy">Vs Easy Computer</option>
            <option value="ai-hard" selected>Vs Hard Computer</option>
          </select>
        </div>

        <div class="col-sm-auto">
          <div class="form-check form-switch ms-2">
            <input class="form-check-input" type="checkbox" id="firstX" checked>
            <label class="form-check-label small" for="firstX">X starts</label>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-md-6 mb-2">
          <div class="card p-2">
            <div class="d-flex justify-content-between align-items-center">
              <strong>X</strong>
              <div id="scoreX">0</div>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 mb-2">
          <div class="card p-2">
            <div class="d-flex justify-content-between align-items-center">
              <strong>O</strong>
              <div id="scoreO">0</div>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-3 text-muted small">
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
